<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Завантаження уроку...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d', 950: '#052e16'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8faf9] text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-brand-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="https://github.com/InfoStudy-gymnasium201-kyiv/InfoStudy-gymnasium201-kyiv.github.io/blob/main/Extra/it405_logo.png?raw=true" alt="InfoStudy Logo" class="h-10 w-auto object-contain" />
        <div>
          <span id="header-tag" class="text-xs font-semibold text-brand-700 uppercase tracking-wider block"></span>
          <h1 id="header-title" class="text-sm md:text-base font-bold font-heading text-slate-800 line-clamp-1">Завантаження...</h1>
        </div>
      </div>
      <div id="header-badge-container" class="hidden md:flex items-center space-x-2 text-xs text-slate-500 bg-brand-50 px-3 py-1.5 rounded-full border border-brand-100">
        <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <span id="header-badge"></span>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-brand-900 via-brand-800 to-emerald-900 text-white py-12 md:py-16 relative overflow-hidden">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center md:text-left">
      <div id="hero-subject" class="inline-flex items-center space-x-2 bg-brand-500/20 backdrop-blur-md border border-brand-400/30 px-3 py-1 rounded-full text-brand-200 text-xs font-medium mb-4">
        <span>Завантаження...</span>
      </div>
      <h1 id="hero-title" class="text-3xl sm:text-4xl lg:text-5xl font-extrabold font-heading tracking-tight text-white mb-4">
        ...
      </h1>
      <p id="hero-desc" class="text-brand-100 text-base sm:text-lg max-w-3xl leading-relaxed mb-6">
        ...
      </p>
      <div id="hero-career" class="bg-white/10 backdrop-blur-sm border border-white/15 rounded-2xl p-4 sm:p-5 text-brand-50 text-sm flex items-start space-x-3 max-w-2xl hidden">
        <p id="hero-career-text" class="leading-relaxed"></p>
      </div>
    </div>
  </section>

  <!-- Main Layout -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Sidebar / Table of contents -->
      <aside class="lg:col-span-3">
        <div class="sticky top-20 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Зміст параграфа</h2>
          <nav id="toc" class="space-y-1 text-sm max-h-[calc(100vh-160px)] overflow-y-auto pr-1">
            <!-- Зміст генерується динамічно -->
          </nav>
        </div>
      </aside>

      <!-- Main Article Content -->
      <main id="content" class="lg:col-span-9 space-y-10">
        <!-- Контент генерується динамічно -->
      </main>
    </div>
  </div>

  <!-- Modal / Lightbox для збільшення зображень -->
  <div id="image-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300" onclick="closeModal()">
    <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute -top-10 right-0 text-white hover:text-brand-400 text-3xl font-bold p-2 focus:outline-none transition" title="Закрити (Esc)">
        &times;
      </button>
      <img id="modal-img" src="" alt="" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl">
      <p id="modal-caption" class="text-white/90 text-sm mt-4 text-center px-4 max-w-2xl"></p>
    </div>
  </div>

  <script>
    async function loadLesson() {
      const urlParams = new URLSearchParams(window.location.search);
      const lessonId = urlParams.get('lesson') || '2627.7.3';

      const jsonUrl = `https://raw.githubusercontent.com/InfoStudy-gymnasium201-kyiv/s/refs/heads/main/Lessons/${lessonId}.json`;

      try {
        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error(`Не вдалося знайти урок за кодом: ${lessonId}`);
        const lesson = await response.json();

        // 1. Рендер Header
        document.getElementById('header-tag').innerText = lesson.meta.topicTag || lesson.meta.subject || '';
        document.getElementById('header-title').innerText = lesson.meta.title;
        
        if (lesson.meta.badgeText) {
          document.getElementById('header-badge').innerText = lesson.meta.badgeText;
          document.getElementById('header-badge-container').classList.remove('hidden');
          document.getElementById('header-badge-container').classList.add('flex');
        }

        // 2. Рендер Hero
        document.getElementById('page-title').innerText = `${lesson.meta.title} | ${lesson.meta.topicTag || lesson.meta.subject}`;
        document.getElementById('hero-subject').innerHTML = `<span>${lesson.meta.topicTag || lesson.meta.subject}</span>`;
        document.getElementById('hero-title').innerText = lesson.meta.title;
        document.getElementById('hero-desc').innerText = lesson.meta.description;

        if (lesson.meta.careerNote) {
          document.getElementById('hero-career').classList.remove('hidden');
          document.getElementById('hero-career-text').innerHTML = `<strong class="text-white font-semibold">Питання/Орієнтир:</strong> ${lesson.meta.careerNote}`;
        }

        // 3. Рендер Змісту (Sidebar)
        const toc = document.getElementById('toc');
        toc.innerHTML = lesson.sections.map(sec => `
          <a href="#${sec.id}" class="flex items-center text-slate-600 hover:text-brand-700 hover:bg-brand-50 px-3 py-2 rounded-lg font-medium transition">
            <span class="w-6 text-brand-600 font-bold">${sec.stepNumber}.</span> ${sec.title}
          </a>
        `).join('');

        // 4. Рендер Секцій контенту
        const mainContent = document.getElementById('content');
        mainContent.innerHTML = lesson.sections.map(sec => `
          <section id="${sec.id}" class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm relative overflow-hidden scroll-mt-20">
            <div class="flex items-center space-x-3 mb-6">
              <span class="px-3 py-1 bg-brand-100 text-brand-800 text-xs font-bold rounded-full uppercase tracking-wider">Крок ${sec.stepNumber}</span>
              <h2 class="text-2xl font-bold font-heading text-slate-800">${sec.title}</h2>
            </div>
            ${renderBlocks(sec.content)}
          </section>
        `).join('');

      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="bg-red-50 text-red-700 p-6 rounded-2xl border border-red-200">
            <h3 class="font-bold text-lg mb-2">Помилка завантаження уроку</h3>
            <p>${err.message}</p>
            <p class="text-xs text-red-500 mt-2">Спробуйте перевірити правильно написаний код уроку в посиланні.</p>
          </div>`;
      }
    }

    // Універсальний рендерер блоків
    function renderBlocks(blocks) {
      return blocks.map(block => {
        switch (block.type) {
          case 'paragraph':
            return `<p class="text-slate-600 mb-6 leading-relaxed">${block.text}</p>`;

          case 'image':
            return `
              <div class="my-6">
                <img src="${block.src}" alt="${block.alt || ''}" onclick="openModal('${block.src}', '${(block.caption || block.alt || '').replace(/'/g, "\\'")}')" class="w-full h-auto rounded-xl border border-slate-200 object-cover shadow-sm cursor-pointer transition-transform hover:scale-[1.01]" title="Натисніть для збільшення">
                <p class="text-xs text-center text-slate-500 mt-2">${block.caption || ''}</p>
              </div>`;

          case 'callout':
            return `
              <div class="bg-emerald-50 border-l-4 border-emerald-500 p-5 rounded-r-xl mb-6">
                <h3 class="text-emerald-900 font-bold text-sm uppercase tracking-wider mb-2">${block.title}</h3>
                ${block.text ? `<p class="text-emerald-950 text-sm leading-relaxed">${block.text}</p>` : ''}
                ${block.items ? `
                  <ul class="space-y-1.5 text-sm text-emerald-900">
                    ${block.items.map(it => `<li class="flex items-start"><span class="text-emerald-600 mr-2">•</span><span>${it}</span></li>`).join('')}
                  </ul>
                ` : ''}
              </div>`;

          case 'acronymCard':
            return `
              <div class="bg-slate-900 text-white p-6 rounded-2xl mb-6 border border-slate-800 shadow-md">
                <h3 class="font-bold font-heading text-base text-brand-300 mb-4">${block.title}</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  ${block.items.map(it => `
                    <div class="bg-white/5 border border-white/10 p-3 rounded-xl text-center">
                      <div class="text-2xl font-black text-brand-400 mb-0.5">${it.letter}</div>
                      <div class="text-xs font-bold text-white mb-1">${it.term}</div>
                      <div class="text-[11px] text-slate-300 leading-tight">${it.description}</div>
                    </div>
                  `).join('')}
                </div>
              </div>`;

          case 'categoryBlock':
            return `
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6">
                <h3 class="font-bold text-slate-800 text-base mb-1">${block.title}</h3>
                ${block.description ? `<p class="text-xs text-slate-600 mb-4 leading-relaxed">${block.description}</p>` : ''}
                ${block.items ? `
                  <div class="space-y-3">
                    ${block.items.map(it => `
                      <div class="bg-white border border-slate-200 p-3.5 rounded-lg">
                        <div class="font-bold text-brand-700 text-sm mb-1">${it.name}</div>
                        <div class="text-xs text-slate-600 leading-relaxed">${it.text}</div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
                ${block.subcategories ? `
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                    ${block.subcategories.map(sub => `
                      <div class="bg-white border border-slate-200 p-3.5 rounded-lg">
                        <div class="font-bold text-slate-800 text-xs uppercase tracking-wider mb-1">${sub.title}</div>
                        <div class="text-xs text-slate-600 leading-relaxed">${sub.text}</div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>`;

          case 'summaryList':
            return `
              <div class="bg-brand-50/60 border border-brand-200 p-5 rounded-2xl mb-6">
                <h3 class="font-bold text-brand-900 text-base mb-3">${block.title}</h3>
                <ul class="space-y-2 text-xs sm:text-sm text-slate-700">
                  ${block.items.map(it => `<li class="flex items-start"><span class="text-brand-600 font-bold mr-2">✓</span><div>${it}</div></li>`).join('')}
                </ul>
              </div>`;

          case 'questionsList':
            return `
              <div class="space-y-3 mb-6">
                <h3 class="font-bold text-slate-800 text-base mb-2">${block.title}</h3>
                ${block.items.map((q, i) => `
                  <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-start space-x-3">
                    <span class="w-6 h-6 bg-brand-600 text-white rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">${i + 1}</span>
                    <p class="text-sm font-medium text-slate-800">${q}</p>
                  </div>
                `).join('')}
              </div>`;

          case 'resources':
            return `
              <div class="bg-slate-900 text-white p-5 rounded-2xl border border-slate-800">
                <h3 class="font-bold text-sm text-slate-300 uppercase tracking-wider mb-3">${block.title}</h3>
                <div class="flex flex-wrap gap-2">
                  ${block.links.map(link => `
                    <a href="${link.url}" target="_blank" class="inline-flex items-center space-x-2 bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition">
                      <span>${link.label}</span>
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                  `).join('')}
                </div>
              </div>`;

          case 'definition':
            return `
              <div class="bg-amber-50 border-l-4 border-amber-500 p-5 rounded-r-xl mb-6">
                <h3 class="text-amber-900 font-bold text-sm uppercase tracking-wider mb-1">Термін</h3>
                <p class="text-amber-950 font-medium leading-relaxed">
                  <strong>${block.term}</strong> — ${block.text}
                </p>
              </div>`;

          default:
            return '';
        }
      }).join('');
    }

    // Функції керування модальним вікном для зображень
    function openModal(src, caption) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const modalCaption = document.getElementById('modal-caption');

      modalImg.src = src;
      modalCaption.innerText = caption || '';
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // Блокуємо скрол фону
    }

    function closeModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.add('hidden');
      document.body.style.overflow = ''; // Відновлюємо скрол фону
    }

    // Закриття клавішею Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', loadLesson);
  </script>
</body>
</html>
